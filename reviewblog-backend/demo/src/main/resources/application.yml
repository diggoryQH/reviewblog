server:
  port: 8080

spring:
  application:
    name: reviewblog-backend
  profiles:
    active: postgres
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/reviewblog
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
app:
  jwt:
    secret:
      "ThisIsADemoSecretKeyForReviewBlogPleaseChangeItInProduction123456"
    expiration-ms: 86400000
